name: "Release: publish nuget packages"

on:
  release:
    types: [published]
env:
  DOTNET_VERSION: "10.0.x"

jobs:
  Check:
    runs-on: ubuntu-latest
    outputs: 
      package-version: ${{ steps.package-version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.ref }}
      
      - name: "Get package version"
        uses: ./.github/actions/package-version
        id: package-version
  Release:
    needs: Check
    runs-on: ubuntu-latest
    env:
      ARTIFACT_DIR: out
      PACKAGE_VERSION: ${{ needs.Check.outputs.package-version }}
    permissions:
      contents: read
      id-token: write # nuget.org Trusted Publishing exchanges the GitHub OIDC token for a short-lived API key
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Test
        run: dotnet test

      - name: Pack
        env:
          PACK_ARGS: -c Release -o ${{ env.ARTIFACT_DIR }} -p:Version=${{ env.PACKAGE_VERSION }}
        run: |
          dotnet pack LocalQueue/LocalQueue.csproj $PACK_ARGS
          dotnet pack LocalQueue.MySql/LocalQueue.MySql.csproj $PACK_ARGS
          dotnet pack LocalQueue.PostgreSql/LocalQueue.PostgreSql.csproj $PACK_ARGS
          dotnet pack LocalQueue.OpenTelemetry/LocalQueue.OpenTelemetry.csproj $PACK_ARGS

      - name: NuGet login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: pobochniy

      - name: Push to nuget.org
        # symbol packages (.snupkg) next to the .nupkg are pushed too
        run: >
          dotnet nuget push "${{ env.ARTIFACT_DIR }}/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --skip-duplicate
